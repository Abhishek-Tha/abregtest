name: EDS Block Regression (BlockGuard)

on:
  pull_request:
    paths:
      - "blocks/**"
      - "scripts/**"
      - "styles/**"
      - "icons/**"
      - "blockguard.config.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode'
        required: false
        default: 'representative'
        type: choice
        options:
          - representative
          - full

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  blockguard:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libxkbcommon0 \
            libpango-1.0-0 libcairo2 libasound2

      - name: Run BlockGuard regression
        id: blockguard
        uses: Abhishek-Tha/regressionvalidator/packages/action@main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          owner: abhishek-tha    # ← e.g. Abhishek-Tha
          repo: https://main--abregtest--abhishek-tha.aem.live/              # ← e.g. my-eds-site
          base-branch: main
          page-index-url: https://main--abregtest--abhishek-tha.aem.live/query-index.json
          github-token: ${{ secrets.GH_TOKEN }}
          mode: ${{ inputs.mode || 'representative' }}
          max-pages: '15'
          fail-on-regression: 'false'
          advisory-mode: 'true'

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockguard-report
          path: /tmp/blockguard-report/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "Status:          ${{ steps.blockguard.outputs.status }}"
          echo "Affected pages:  ${{ steps.blockguard.outputs.affected-pages }}"
          echo "Tested pages:    ${{ steps.blockguard.outputs.tested-pages }}"
