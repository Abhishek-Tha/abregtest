name: EDS Block Regression (BlockGuard)

on:
  pull_request:
    paths:
      - "blocks/**"
      - "scripts/**"
      - "styles/**"
      - "icons/**"
      - "blockguard.config.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode'
        required: false
        default: 'representative'
        type: choice
        options:
          - representative
          - full

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  blockguard:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libcups2t64 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxkbcommon0 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Install Chrome via Puppeteer
        run: npx puppeteer browsers install chrome
        env:
          PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

      - name: Run BlockGuard regression
        uses: Abhishek-Tha/regressionvalidator/packages/action@main
        with:
          owner: abhishek-tha          # ← just your GitHub username, NO URL
          repo: abregtest              # ← just the repo name, NO URL  
          base-branch: main
          page-index-url: https://main--abregtest--abhishek-tha.aem.live/query-index.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: representative
          max-pages: '15'
          fail-on-regression: 'false'
          advisory-mode: 'true'

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockguard-report
          path: /tmp/blockguard-report/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "Status:          ${{ steps.blockguard.outputs.status }}"
          echo "Affected pages:  ${{ steps.blockguard.outputs.affected-pages }}"
          echo "Tested pages:    ${{ steps.blockguard.outputs.tested-pages }}"
