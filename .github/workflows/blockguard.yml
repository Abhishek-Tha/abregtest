name: EDS Block Regression (BlockGuard)

on:
  pull_request:
    paths:
      - "blocks/**"
      - "styles/**"
      - "scripts/**"
      - "blockguard.config.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode'
        required: false
        default: 'representative'
        type: choice
        options:
          - representative
          - full
      max_pages:
        description: 'Maximum pages to test'
        required: false
        default: '300'
      trigger_reason:
        description: 'Reason for manual trigger (optional, for audit log)'
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  blockguard:
    runs-on: ubuntu-latest
    # ── Execution guard ─────────────────────────────────────────────────────────
    # trigger-mode is set to 'manual' in the action inputs below.
    # This if-condition enforces the same intent at the WORKFLOW level:
    #   • pull_request events are ignored entirely (workflow queues but exits in <1s)
    #   • workflow_dispatch (GitHub UI or MCP trigger_pr_regression) always runs
    #
    # To re-enable automatic PR runs, either:
    #   a) Remove this `if:` line, OR
    #   b) Change trigger-mode below from 'manual' to 'auto'
    if: github.event_name == 'workflow_dispatch'
    # Parallel viewports + page-reuse captures keep 8-page runs well under 10 min.
    # Raise to 15 if you add more viewports or have a slow preview deploy.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for git diff

      - name: Run BlockGuard regression
        id: blockguard
        uses: Abhishek-Tha/regressionvalidator-enhancements/packages/action@main
        with:
          owner: abhishek-tha
          repo: abregtest
          base-branch: main
          page-index-url: https://main--abregtest--abhishek-tha.aem.live/query-index.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: blockguard.config.yml          # reads per-scope/viewport thresholds
          mode: ${{ inputs.mode || 'representative' }}
          max-pages: ${{ inputs.max_pages || '8' }}
          fail-on-regression: 'false'            # advisory mode — never blocks the PR
          advisory-mode: 'true'
          # ── Feature toggle ──────────────────────────────────────────────────
          # trigger-mode: "auto"   (default) runs on every PR that touches blocks/
          # trigger-mode: "manual" skips automatic PR runs — trigger from MCP only
          # Uncomment the line below to switch to MCP-only / on-demand mode:
          trigger-mode: 'manual'

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockguard-report-${{ github.run_id }}
          path: /tmp/blockguard-report/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "Status:          ${{ steps.blockguard.outputs.status }}"
          echo "Affected pages:  ${{ steps.blockguard.outputs.affected-pages }}"
          echo "Tested pages:    ${{ steps.blockguard.outputs.tested-pages }}"
          echo "Report path:     ${{ steps.blockguard.outputs.report-path }}"
